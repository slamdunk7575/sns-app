spring:
  application:
    name: sns-app
  datasource:
    url: jdbc:postgresql://localhost:5432/snsdb
    username: snsuser
    password: snspassword
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
management:
  metrics:
    tags:
      application: sns-app
  health:
    db:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health, prometheus"

# OpenTelemetry 로 수집할건데 logstash 를 기본 포맷으로 설정한 이유?
# SpringBoot 에서 logstash 형식의 JSON 출력을 기본적으로 지원함
# OpenTelemetry 에서 이런 JSON 형식을 수집하기 좋기 때문에 사용
# 예: {"timestamp": "2026-11-05T10:00:00Z", "message": "게시글 조회 실패", "level": "ERROR", "logger_name": "PostService"}
# 애플리케이션 이름(예: "service_name": "sns-app")을 JSON 출력에 추가
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service_name: "${spring.application.name}"
rustfs:
  endpoint: http://localhost:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: media
  region: ap-northeast-2
  presigned-url-expiration-seconds: 3600
