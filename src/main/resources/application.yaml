spring:
  application:
    name: sns-app
  datasource:
    url: jdbc:postgresql://localhost:5432/snsdb
    username: snsuser
    password: snspassword
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
management:
  # 애플리케이션에서 OpenTelemetry 컬렉터로 보내는건 tracing 밖에 없음
  # logging 경우: OpenTelemetry 컬렉터가 백그라운드에서 주기적으로 워커노드를 조회하면서 파일 한줄한줄 가져옴
  # metrics 경우: Prometheus endpoint 열어두어(/actuator/prometheus) 주기적으로 애플리케이션의 메트릭 정보를 가져감
  # 따라서 metrics, logging 비활성화
  # sampling probability 1.0 설정은 모든 트레이싱을 다 보낸다는 설정 (0.5 로 하면 두개중에 1개만 보낸다는 뜻)
  otlp:
    metrics:
      export:
        enabled: false
    logging:
      export:
        otlp:
          enabled: false
    tracing:
      export:
        otlp:
          enabled: true
      sampling:
        probability: 1.0
  metrics:
    tags:
      application: sns-app
  health:
    db:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health, prometheus"
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces"
          transport: http
recommend:
  base-url: "${RECOMMEND_BASE_URL:http://localhost:8081}"
  connect-timeout: 200ms
  read-timeout: 200ms
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service_name: "${spring.application.name}"
rustfs:
  endpoint: http://localhost:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: media
  region: ap-northeast-2
  presigned-url-expiration-seconds: 3600
